<!doctype html>
<html><head><meta charset="utf-8"><title>Lake ending</title>
<style>html,body{margin:0;background:#020202}.stage{position:relative;width:1600px;height:900px;overflow:hidden;background:#020202}canvas{position:absolute;inset:0;width:1600px;height:900px}.glow{position:absolute;inset:0;pointer-events:none}</style></head>
<body><div class="stage"><canvas width="1600" height="900"></canvas><div class="glow"></div></div>
<script src="lake3d.js"></script>
<script>
/* The closing shot of the SideAI film: the lake rises out of the dark like a horizon and
   runs through one day, dawn to night, using the palettes of the live hero. */
(function () {
  var KEYS = ["skyTop", "skyHor", "sunCol", "cloud", "far", "snowLit", "snowShade", "mid", "hills", "shore", "fog"];
  var hex = function (h) { return [1, 3, 5].map(function (i) { return parseInt(h.slice(i, i + 2), 16) / 255; }); };
  var P = [
    { skyTop: "#7E7DB8", skyHor: "#EDC2A8", sunCol: "#FFE6C6", cloud: "#F4D2C4", far: "#978CBC", snowLit: "#FBE4D8", snowShade: "#B2A6CB", mid: "#76699E", hills: "#4B4769", shore: "#34304C", fog: "#EAC8BF", misc: [0, .55, .35, .8], life: [1, 1, 0, 0] },
    { skyTop: "#4D76B8", skyHor: "#9CB6DA", sunCol: "#FBF4DE", cloud: "#F3F1EB", far: "#7D8EC0", snowLit: "#F6F4EF", snowShade: "#B3BEDA", mid: "#5C6DA0", hills: "#3D5A4E", shore: "#2C3B33", fog: "#CBD7EA", misc: [0, .45, .3, .9], life: [1, 1, 0, 0] },
    { skyTop: "#5E4F8C", skyHor: "#E3885E", sunCol: "#FFD4A0", cloud: "#F0A988", far: "#7A5A89", snowLit: "#F7C6A5", snowShade: "#9A7A9E", mid: "#5A466E", hills: "#3B3250", shore: "#2A2438", fog: "#E6A188", misc: [.2, .5, .35, .85], life: [1, 1, .3, 0] },
    { skyTop: "#1B2150", skyHor: "#3D4886", sunCol: "#FFD4A0", cloud: "#39447A", far: "#35407A", snowLit: "#AEB7DA", snowShade: "#56608F", mid: "#29316A", hills: "#1C2346", shore: "#131832", fog: "#4A5690", misc: [1, .35, .4, .55], life: [0, 1, 1, 1] }
  ].map(function (e) { var t = { misc: e.misc, life: e.life }; KEYS.forEach(function (k) { t[k] = hex(e[k]); }); return t; });
  var ss = function (a, b, x) { var i = Math.min(1, Math.max(0, (x - a) / (b - a))); return i * i * (3 - 2 * i); };
  function state(t) {
    var k = Math.floor(t / 15) % 4, f = ss(11, 15, t - 15 * k), A = P[k], B = P[(k + 1) % 4];
    var lerp = function (a, b) { return a.map(function (v, i) { return v + (b[i] - v) * f; }); };
    var c = {}; KEYS.forEach(function (key) { c[key] = lerp(A[key], B[key]); });
    var n = ((t % 60) + 60) % 60 / 42;
    return { colors: c,
      sun: n <= 1 ? [-0.4 + 0.76 * Math.pow(n, 1.35), -0.2 + 0.52 * Math.pow(Math.sin(Math.PI * n), 0.75), 0.052 + 0.02 * (1 - Math.sin(Math.PI * n)), 1] : [0.4, -0.4, 0.06, 0],
      moon: [-0.3, 0.28, 0.048, Math.max(ss(41, 46, t), 1 - ss(0.5, 4, t))], misc: lerp(A.misc, B.misc), life: lerp(A.life, B.life) };
  }
  var cv = document.querySelector("canvas"), gl = cv.getContext("webgl", { preserveDrawingBuffer: true });
  var sh = function (type, src) { var x = gl.createShader(type); gl.shaderSource(x, src); gl.compileShader(x); if (!gl.getShaderParameter(x, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(x)); return x; };
  var pr = gl.createProgram();
  gl.attachShader(pr, sh(gl.VERTEX_SHADER, "attribute vec2 aPos;varying vec2 vUv;void main(){vUv=aPos*.5+.5;gl_Position=vec4(aPos,0.,1.);}"));
  gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, window.LAKE3D));
  gl.bindAttribLocation(pr, 0, "aPos"); gl.linkProgram(pr); gl.useProgram(pr);
  var b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  var U = function (n) { return gl.getUniformLocation(pr, n); };
  var DUR = 6.2;
  window.lakeDuration = DUR;
  window.renderAt = function (e) {
    var lt = 1.5 + Math.pow(e / DUR, 1.1) * 56;              // dawn … night
    var s = state(lt);
    gl.viewport(0, 0, 1600, 900);
    gl.uniform2f(U("uRes"), 1600, 900); gl.uniform1f(U("uAspect"), 16 / 9); gl.uniform1f(U("uLoop"), lt);
    gl.uniform1f(U("uIntro"), 1); gl.uniform2f(U("uPointer"), 0, 0);
    KEYS.forEach(function (k) { gl.uniform3fv(U("u" + k[0].toUpperCase() + k.slice(1)), s.colors[k]); });
    gl.uniform4fv(U("uSun"), s.sun); gl.uniform4fv(U("uMoon"), s.moon); gl.uniform4fv(U("uMisc"), s.misc); gl.uniform4fv(U("uLife"), s.life);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4); gl.finish();
    // rise out of the dark like a horizon
    var k = Math.min(1, e / 2.6), top = -0.75 + (0.62 + 0.75) * (1 - Math.pow(1 - k, 3));
    var R = 3.2 * 900, cy = 450 - top * 900 + R;
    cv.style.clipPath = "circle(" + R + "px at 800px " + cy + "px)";
    document.querySelector(".glow").style.background = k < 1 ? "radial-gradient(circle " + (R + 30) + "px at 800px " + cy + "px, transparent " + (R - 40) + "px, rgba(255,184,115," + (0.35 * (1 - k)) + ") " + R + "px, transparent " + (R + 30) + "px)" : "none";
  };
  window.ready = 1;
})();
</script></body></html>
